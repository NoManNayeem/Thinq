# Production-like stack:  docker compose up
# Dev with hot reload:    make dev   (docker compose -f compose.yaml -f compose.dev.yaml up)
name: thinq

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thinq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinq}
      POSTGRES_DB: ${POSTGRES_DB:-thinq}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subfolder of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      THINQ_ENVIRONMENT: ${THINQ_ENVIRONMENT:-production}
      THINQ_LOG_JSON: ${THINQ_LOG_JSON:-true}
      THINQ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thinq}:${POSTGRES_PASSWORD:-thinq}@db:5432/${POSTGRES_DB:-thinq}
      THINQ_COOKIE_SECURE: ${THINQ_COOKIE_SECURE:-false}
      THINQ_DEMO_MODE: ${THINQ_DEMO_MODE:-false}
      THINQ_SEED_DIR: /seed
      THINQ_SEED_PASSWORD: ${THINQ_SEED_PASSWORD:-}
    volumes:
      - ${THINQ_SEED_PATH:-./seed/sample}:/seed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      start_interval: 2s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      THINQ_BACKEND_URL: http://backend:8000
    ports:
      - "${THINQ_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      start_interval: 2s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
