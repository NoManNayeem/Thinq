name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: thinq
          POSTGRES_PASSWORD: thinq
          POSTGRES_DB: thinq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thinq" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      THINQ_TEST_DATABASE_URL: postgresql+psycopg://thinq:thinq@localhost:5432/thinq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: OpenAPI schema is committed and current
        run: |
          uv run python -m app.openapi > /tmp/openapi.json
          diff -u ../frontend/lib/api/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the committed schema
        run: pnpm api:types && git diff --exit-code lib/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 pnpm test:e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
